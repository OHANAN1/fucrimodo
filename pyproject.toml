[build-system]
requires = ["setuptools >= 61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fucrimodo"
version = "0.1.1"
description = "Find Unknown Crystals by Inversion of ML Optimized Descriptors"
authors = [
  {name = "Louis Böhm", email =  "louis.boehm@gmx.de"},
  {name = "Martin Kuban", email = "missing@hu-berlin.de"}, # TODO: Add Martins Email
]
maintainers = [
  {name = "Louis Böhm", email = "louis.boehm@gmx.de"}
]
readme = "README.md"
keywords = ["tools", "fucrimodo", "Material Science"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Unix based",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
    "ase==3.25.0",
    "matid==2.1.5",
    "numpy==1.26.4",
    "matplotlib==3.9.1",
    "pandas==2.2.3",
    "deap==1.4.1",
    "spglib==2.5.0",
    "pyxtal==1.0.6",
    "dscribe==2.1.1",
    "ase-ga==1.0.3",
    "click==8.4.2"
]
requires-python = ">=3.12"

[project.optional-dependencies]
docs = ['sphinx == 9.1.0', 'sphinx_rtd_theme == 3.1.0', 'nbsphinx == 0.9.8']
dev = ['pytest == 9.1.1']

[project.urls]
Repository = "https://git.physik.hu-berlin.de/boehmlou/fucrimodo"

# Adds fucrimodo.__main__() in the executables path
[project.scripts]
fucrimodo = "fucrimodo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fucrimodo = [
  "lab_template/*.py",
  "lab_template/*.md",
  "lab_template/**/.*py",
  "lab_template/**/**/*.py",
  "lab_template/**/**/**/*.py",
  "lab_template/data/raw/*.xyz",
  "lab_template/scripts/*.sh"
]


# Setup of pytest tests
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take a long time (> 10s).",
]

# High verbosity and short tracebacks
addopts = "-v --tb=short"
